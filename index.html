<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiếng Việt 4 - Bài 11</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ff;font-family:Arial;color:#29264d}main{max-width:820px;margin:auto;padding:14px}header{background:#6758b9;color:#fff;padding:22px;border-radius:22px}h1{margin:0 0 8px}.top{display:flex;gap:8px;margin:14px 0}.pill{background:#fff;padding:9px 13px;border-radius:20px;font-weight:bold}.track{height:10px;background:#ddd9ef;border-radius:10px;overflow:hidden}#bar{height:100%;background:#f39a2d}.card{background:#fff;padding:21px;border-radius:20px;margin-top:14px}.sec{font-weight:bold;color:#d06b00}h2{font-size:clamp(19px,4vw,24px);line-height:1.45}.ans{display:block;width:100%;margin:10px 0;padding:14px;text-align:left;border:2px solid #dfddea;background:#fff;border-radius:13px;font-size:16.5px}.good{background:#e8f8ed;border-color:#35a65a}.bad{background:#fff0ef;border-color:#d75757}#fb{min-height:54px;padding:14px 0;font-weight:bold}#next{display:none;width:100%;padding:14px;border:0;border-radius:13px;background:#6253b5;color:#fff;font-size:17px;font-weight:bold}</style></head><body><main><header><h1>📖 Tiếng Việt 4 – Bài 11</h1><div>Đọc hiểu & Luyện tập về động từ • Kết nối tri thức<br><b>30 câu – đã kiểm tra lại nội dung</b></div></header><div class=top><span class=pill id=n></span><span class=pill id=s>⭐ 0 điểm</span></div><div class=track><div id=bar></div></div><div class=card id=card><div class=sec id=sec></div><h2 id=q></h2><div id=a></div><div id=fb></div><button id=next>Câu tiếp theo →</button></div></main><script>const Q=[{"sec": "Đọc hiểu", "q": "Cuối tuần, ba cho bạn nhỏ về quê thăm ngoại. Ngoài việc thăm ngoại, bạn nhỏ còn có mục đích gì?", "a": "Tìm ý cho bài văn “Tả cây hoa nhà em”.", "ops": ["Học trồng rau.", "Tìm ý cho bài văn “Tả cây hoa nhà em”.", "Thăm bạn cũ.", "Đi câu cá."]}, {"sec": "Đọc hiểu", "q": "Ở quê, bạn nhỏ gặp lại cây hoa nào?", "a": "Cây hoa hồng mà ngoại trồng ở mảnh vườn trước cửa.", "ops": ["Cây hoa giấy.", "Cây hoa cúc.", "Cây hoa hồng mà ngoại trồng ở mảnh vườn trước cửa.", "Cây hoa mai."]}, {"sec": "Đọc hiểu", "q": "Vì sao tối thứ Bảy bạn nhỏ chưa thể viết bài văn?", "a": "Trong bóng tối, các bụi hồng, dạ lí, mẫu đơn trông không khác gì nhau.", "ops": ["Ngoại không cho ra vườn.", "Trong bóng tối, các bụi hồng, dạ lí, mẫu đơn trông không khác gì nhau.", "Bạn quên vở.", "Bạn không thích hoa."]}, {"sec": "Đọc hiểu", "q": "Sáng hôm sau, bạn nhỏ ra vườn vào lúc nào?", "a": "Khi trời còn mù sương.", "ops": ["Khi trời còn mù sương.", "Giữa trưa.", "Khi nắng lên cao.", "Lúc trời tối."]}, {"sec": "Đọc hiểu", "q": "Cành hoa nhỏ được so sánh với gì?", "a": "Ngón tay út.", "ops": ["Sợi dây.", "Ngón tay út.", "Chiếc đũa.", "Cành tre."]}, {"sec": "Đọc hiểu", "q": "Lá hoa hồng được miêu tả như thế nào?", "a": "Nhiều lá hình trái tim viền răng cưa.", "ops": ["Nhiều lá hình trái tim viền răng cưa.", "Lá tròn, nhẵn.", "Lá hình vuông.", "Lá dài."]}, {"sec": "Đọc hiểu", "q": "Sương trên lá được liên tưởng với hình ảnh nào?", "a": "Những hòn bi ve tí xíu.", "ops": ["Những hạt gạo.", "Những viên kẹo.", "Những hạt cát.", "Những hòn bi ve tí xíu."]}, {"sec": "Đọc hiểu", "q": "Bạn nhỏ dùng giác quan nào khi đi tìm mùi thơm ngào ngạt giữa những cánh hoa?", "a": "Khứu giác.", "ops": ["Thị giác.", "Xúc giác.", "Thính giác.", "Khứu giác."]}, {"sec": "Đọc hiểu", "q": "Vì sao cuốn vở rơi xuống gốc cây hồng?", "a": "Bạn nhỏ định chạy lại bậc thềm đọc câu hỏi gợi ý và chẳng may đánh rơi vở.", "ops": ["Ngoại đặt vở ở đó.", "Bạn cố ý ném vở.", "Bạn nhỏ định chạy lại bậc thềm đọc câu hỏi gợi ý và chẳng may đánh rơi vở.", "Gió thổi vở bay."]}, {"sec": "Đọc hiểu", "q": "Khi cúi xuống nhặt cuốn vở dưới gốc cây hồng, điều gì xảy ra?", "a": "Tay bạn nhỏ bị gai cào một vết.", "ops": ["Bị ngã.", "Bị ong đốt.", "Làm gãy cành.", "Tay bạn nhỏ bị gai cào một vết."]}, {"sec": "Đọc hiểu", "q": "Sau khi bị gai cào, bạn nhỏ nhận ra đặc điểm nào?", "a": "Hoa hồng có gai.", "ops": ["Hoa chỉ nở đêm.", "Hoa không có lá.", "Hoa hồng có gai.", "Hoa không thơm."]}, {"sec": "Đọc hiểu", "q": "Gợi ý cuối cùng trong sách hỏi điều gì?", "a": "Em đã chăm sóc, bảo vệ cây hoa đó như thế nào?", "ops": ["Em đã chăm sóc, bảo vệ cây hoa đó như thế nào?", "Ai mua cây?", "Cây có bao nhiêu lá?", "Cây cao bao nhiêu?"]}, {"sec": "Đọc hiểu", "q": "Bạn nhỏ làm gì sau khi đọc gợi ý cuối cùng?", "a": "Vội lấy bình, múc nước rồi tưới cây hoa hồng.", "ops": ["Vội lấy bình, múc nước rồi tưới cây hoa hồng.", "Cắt cành.", "Đi ngủ.", "Hái hoa."]}, {"sec": "Đọc hiểu", "q": "Chi tiết “tay tôi bị gai cào một vết” cho thấy bạn nhỏ cảm nhận bằng giác quan nào?", "a": "Xúc giác.", "ops": ["Xúc giác.", "Vị giác.", "Thính giác.", "Khứu giác."]}, {"sec": "Đọc hiểu", "q": "Theo bài đọc, cách nào giúp viết văn miêu tả đúng và sinh động hơn?", "a": "Quan sát kĩ, kết hợp các giác quan và liên tưởng, tưởng tượng.", "ops": ["Không cần quan sát.", "Chỉ nhìn từ xa.", "Chép bài khác.", "Quan sát kĩ, kết hợp các giác quan và liên tưởng, tưởng tượng."]}, {"sec": "Luyện từ và câu", "q": "Trong câu “Cây hoa hồng bỗng giật mình, rung rinh”, từ nào chỉ hoạt động hoặc trạng thái của cây?", "a": "rung rinh", "ops": ["hoa hồng", "cây", "rung rinh", "sương"]}, {"sec": "Luyện từ và câu", "q": "Từ nào KHÔNG phải là động từ?", "a": "bông hoa", "ops": ["chạy", "bông hoa", "bơi", "nhảy"]}, {"sec": "Luyện từ và câu", "q": "Điền động từ: “Bỗng một con gà trống ___ cánh phành phạch”.", "a": "vỗ", "ops": ["gáy", "kêu", "vỗ", "vọng"]}, {"sec": "Luyện từ và câu", "q": "Điền động từ: “... cất tiếng ___ lanh lảnh ở đầu bản”.", "a": "gáy", "ops": ["kêu", "vọng", "gáy", "vỗ"]}, {"sec": "Luyện từ và câu", "q": "Điền động từ: “Mấy con gà rừng trên núi cũng thức dậy ___ te te”.", "a": "gáy", "ops": ["gáy", "vọng", "kêu", "vỗ"]}, {"sec": "Luyện từ và câu", "q": "Điền động từ: “Ngoài suối, tiếng chim cuốc ___ vào đều đều”.", "a": "vọng", "ops": ["gáy", "kêu", "vọng", "vỗ"]}, {"sec": "Luyện từ và câu", "q": "Nhóm nào gồm toàn động từ chỉ hoạt động di chuyển?", "a": "đi, chạy, bay, bơi", "ops": ["đi, chạy, bay, bơi", "cao, rộng, dài, đẹp", "xanh, đỏ, tím, vàng", "bàn, ghế, sách, vở"]}, {"sec": "Luyện từ và câu", "q": "Trong câu “Bạn nhỏ tưới cây hoa hồng”, động từ là từ nào?", "a": "tưới", "ops": ["tưới", "bạn nhỏ", "cây", "hoa hồng"]}, {"sec": "Luyện từ và câu", "q": "Trong câu “Chú chim bay qua vườn hoa”, động từ chỉ hoạt động di chuyển là từ nào?", "a": "bay", "ops": ["hoa", "chú chim", "vườn", "bay"]}, {"sec": "Luyện từ và câu", "q": "Câu nào có động từ chỉ hoạt động di chuyển?", "a": "Bạn Nam chạy ra sân.", "ops": ["Chiếc cặp màu đỏ.", "Bạn Nam chạy ra sân.", "Bầu trời rất xanh.", "Bông hoa rất đẹp."]}, {"sec": "Luyện từ và câu", "q": "Động từ phù hợp nhất với hoạt động di chuyển dưới nước là gì?", "a": "bơi", "ops": ["đọc", "ngủ", "bơi", "viết"]}, {"sec": "Luyện từ và câu", "q": "Câu nào dùng động từ phù hợp nhất?", "a": "Đàn chim bay trên bầu trời.", "ops": ["Đàn chim viết trên bầu trời.", "Đàn chim bơi trên bầu trời.", "Đàn chim đọc trên bầu trời.", "Đàn chim bay trên bầu trời."]}, {"sec": "Luyện từ và câu", "q": "Trong câu “Em chạy nhanh ra sân rồi nhảy dây”, có mấy động từ chỉ hoạt động?", "a": "2 động từ", "ops": ["2 động từ", "3 động từ", "1 động từ", "4 động từ"]}, {"sec": "Luyện từ và câu", "q": "Câu nào có hai động từ?", "a": "Bạn nhỏ múc nước rồi tưới cây.", "ops": ["Bạn nhỏ múc nước rồi tưới cây.", "Lá cây xanh mướt.", "Hoa hồng rất đẹp.", "Cành hoa nhỏ xinh."]}, {"sec": "Luyện từ và câu", "q": "Trong câu “Tôi vội lấy cái bình, múc nước rồi tưới cây”, các động từ chỉ hoạt động là nhóm nào?", "a": "lấy, múc, tưới", "ops": ["vội, nước, cây", "tôi, bình, cây", "cái, rồi, cây", "lấy, múc, tưới"]}];let i=0,s=0,L=false,$=x=>document.getElementById(x);function r(){L=false;let x=Q[i];$("n").textContent=`Câu ${i+1}/30`;$("s").textContent=`⭐ ${s} điểm`;$("bar").style.width=i/30*100+"%";$("sec").textContent=x.sec;$("q").textContent=x.q;$("a").innerHTML="";$("fb").textContent="";$("next").style.display="none";x.ops.forEach((o,j)=>{let b=document.createElement("button");b.className="ans";b.innerHTML=`<b>${String.fromCharCode(65+j)}.</b> ${o}`;b.onclick=()=>c(o,b);$("a").appendChild(b)})}function c(o,b){if(L)return;L=true;let x=Q[i];[...$("a").children].forEach((z,j)=>{z.disabled=true;if(x.ops[j]===x.a)z.classList.add("good")});if(o===x.a){s++;$("fb").textContent="✅ Chính xác!"}else{b.classList.add("bad");$("fb").textContent="❌ Chưa đúng. Đáp án đúng: "+x.a}$("s").textContent=`⭐ ${s} điểm`;$("next").style.display="block"}$("next").onclick=()=>{i++;if(i<30)r();else{$("bar").style.width="100%";$("card").innerHTML=`<div style="text-align:center"><div style="font-size:60px">🏆</div><h2>Hoàn thành!</h2><p style="font-size:22px;font-weight:bold">Kết quả: ${s}/30</p><button id=next style="display:block" onclick="location.reload()">Làm lại ↻</button></div>`}};r();</script></body></html>
